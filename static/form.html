<!doctype html><meta charset="utf-8">
<title>Tenant Repair Report</title>
<body style="margin:0;background:#0b0f14;color:#e5e7eb;font-family:Segoe UI,Roboto,Arial,sans-serif">
  <div style="max-width:760px;margin:32px auto;padding:24px;background:#111827;border:1px solid #1f2937;border-radius:14px">
    <h2 style="margin-top:0">New Repair Report</h2>
    <form id="f" style="display:grid;gap:12px">
      <label>Tenant ID <input name="tenantId" required style="width:100%"></label>
      <label>Property ID <input name="propertyId" required style="width:100%"></label>
      <label>Description <textarea name="description" required rows="5" style="width:100%"></textarea></label>
      <label>Photo URL <input name="photoUrl" style="width:100%"></label>
      <label>Source Channel <input name="sourceChannel" value="web" required style="width:100%"></label>
      <button style="background:#2563eb;color:#fff;border:0;border-radius:8px;padding:10px 14px">Submit</button>
    </form>
    <pre id="out" style="margin-top:16px;background:#0b1220;padding:12px;border-radius:10px;border:1px solid #1f2937"></pre>
  </div>
<script>
document.getElementById('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const fd = new FormData(e.target);
  const body = Object.fromEntries(fd.entries());
  const r = await fetch('/web/api/reports', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  document.getElementById('out').textContent = JSON.stringify(await r.json(), null, 2);
});
</script>
</body>
